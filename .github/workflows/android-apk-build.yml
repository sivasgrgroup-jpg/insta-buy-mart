
name: Build INSTA BUY MART APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTA_BUY_MART_Android_Studio_Project.zip'
      - '.github/workflows/android-apk-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Project
        run: |
          unzip -q INSTA_BUY_MART_Android_Studio_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/insta_buy_mart_android_project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INSTA-BUY-MART-APK
          path: extracted/insta_buy_mart_android_project/app/build/outputs/apk/debug/app-debug.apk
