
name: Build INSTA BUY MART APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTA_BUY_MART_Android_Studio_Project.zip'
      - '.github/workflows/android-apk-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q INSTA_BUY_MART_Android_Studio_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/insta_buy_mart_android_project --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: insta-buy-mart-apk
          path: extracted/insta_buy_mart_android_project/app/build/outputs/apk/debug/app-debug.apk
